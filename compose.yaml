services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on: [api]
    networks: [private]
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  private:
    driver: bridge
